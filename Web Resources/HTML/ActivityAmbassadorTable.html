<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        body {
            font: 12px/1.4 Segoe UI, Arial, sans-serif;
            margin: 8px;
        }

        #toolbar {
            margin-bottom: 8px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 6px 8px;
        }

        th {
            text-align: left;
        }

        .muted {
            color: #666;
        }
    </style>
    <script src="$$webresource:amb_/ActivityAmbassadors.js"></script>
</head>
<body>
    <div id="toolbar">
        <button id="btnReload" type="button">Reload</button>
        <button id="btnExport" type="button">Export CSV</button>
        <span id="status" class="muted"></span>
    </div>
    <div id="grid"></div>

    <script>
    // Boot the widget once the JS is loaded
    if (window.AmbGrid) window.AmbGrid.init();
    </script>
</body>
</html>
